<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Football Analyzer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-analyze { background-color: #2c3e50; color: white; border-radius: 8px; }
        .btn-analyze:hover { background-color: #1a252f; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center mb-4">
            <h1 class="fw-bold text-dark">⚽ AI Football Analyzer</h1>
            <p class="text-muted">Stratejik analiz modelleri ve yapay zeka destekli maç öngörü sistemi</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 mb-4">
                <h5 class="fw-bold mb-3 text-secondary">Analiz Parametreleri</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Ev Sahibi Takım</label>
                        <select id="homeTeamId" class="form-select">
                            <option value="Galatasaray">Galatasaray</option>
                            <option value="Fenerbahçe">Fenerbahçe</option>
                            <option value="Beşiktaş">Beşiktaş</option>
                            <option value="Trabzonspor">Trabzonspor</option>
                            <option value="Samsunspor">Samsunspor</option>
                            <option value="Göztepe">Göztepe</option>
                            <option value="Sivasspor">Sivasspor</option>
                            <option value="Kayserispor">Kayserispor</option>
                            <option value="Eyüpspor">Eyüpspor</option>
                            <option value="Konyaspor">Konyaspor</option>
                            <option value="Antalyaspor">Antalyaspor</option>
                            <option value="Gaziantep">Gaziantep FK</option>
                            <option value="Hatayspor">Hatayspor</option>
                            <option value="Kasımpaşa">Kasımpaşa</option>
                            <option value="Başakşehir">RAMS Başakşehir</option>
                            <option value="Alanyaspor">Corendon Alanyaspor</option>
                            <option value="Rizespor">Çaykur Rizespor</option>
                            <option value="Bodrum">Bodrum FK</option>
                            <option value="Adana Demirspor">Adana Demirspor</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Deplasman Takımı</label>
                        <select id="awayTeamId" class="form-select">
                            <option value="Galatasaray">Galatasaray</option>
                            <option value="Fenerbahçe">Fenerbahçe</option>
                            <option value="Beşiktaş">Beşiktaş</option>
                            <option value="Trabzonspor">Trabzonspor</option>
                            <option value="Samsunspor">Samsunspor</option>
                            <option value="Göztepe">Göztepe</option>
                            <option value="Sivasspor">Sivasspor</option>
                            <option value="Kayserispor">Kayserispor</option>
                            <option value="Eyüpspor">Eyüpspor</option>
                            <option value="Konyaspor">Konyaspor</option>
                            <option value="Antalyaspor">Antalyaspor</option>
                            <option value="Gaziantep">Gaziantep FK</option>
                            <option value="Hatayspor">Hatayspor</option>
                            <option value="Kasımpaşa">Kasımpaşa</option>
                            <option value="Başakşehir">RAMS Başakşehir</option>
                            <option value="Alanyaspor">Corendon Alanyaspor</option>
                            <option value="Rizespor">Çaykur Rizespor</option>
                            <option value="Bodrum">Bodrum FK</option>
                            <option value="Adana Demirspor">Adana Demirspor</option>
                        </select>
                    </div>
                </div>
                <button onclick="runAnalysis()" class="btn btn-analyze w-100 mt-4 fw-bold py-2">Maçı Yapay Zeka ile Analiz Et</button>
            </div>

            <div id="resultBox" class="card p-4 d-none">
                <h4 class="fw-bold text-success mb-3">📊 Yapay Zeka Analiz Raporu</h4>
                <hr>
                <div class="p-3 bg-dark text-light rounded">
                    <p id="rawDataSummary" class="mb-0 small" style="line-height: 1.6; white-space: pre-line;"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function runAnalysis() {
        const homeTeamId = document.getElementById('homeTeamId').value;
        const awayTeamId = document.getElementById('awayTeamId').value;

        try {
            // Backend Controller tetikleniyor
            const response = await fetch(`/api/predictions?leagueId=203&homeTeamId=${homeTeamId}&awayTeamId=${awayTeamId}`);
            if (!response.ok) throw new Error('API Hatası');

            const data = await response.json();
            document.getElementById('rawDataSummary').innerText = data.rawDataSummary;
            document.getElementById('resultBox').classList.remove('d-none');
        } catch (error) {
            alert('Hata: Yapay zeka servisinden yanıt alınamadı. Konsolu kontrol et.');
        }
    }
</script>
</body>
</html>
